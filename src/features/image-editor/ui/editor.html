<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomelo</title>
  <link rel="stylesheet" href="../../../ui-shared/tokens.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-look.css">
  <link rel="stylesheet" href="../../../ui-shared/controls.css">
  <link rel="stylesheet" href="../../../ui-shared/window.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="window">
    <header class="titlerow">
      <div class="titleleft"><button class="ib" id="undo" type="button"></button><button class="ib" id="redo" type="button"></button></div>
      <div class="nameline" id="nameline"><span class="imgname" id="imgname"></span><i class="dot" id="imgdot" title="Unsaved changes" hidden></i><small id="imgsaved" role="status"></small></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Images" hidden></div>
      <div class="titletools"><button class="btn primary" id="savebtn" type="button" hidden>Save</button><button class="ib" id="panelbtn" type="button"></button><button class="ib" id="more" type="button" aria-expanded="false"></button></div>
    </header>
    <div class="body" id="body">
      <main class="well" id="well">
        <div class="stage" id="stage"><div class="checker" id="checker" hidden></div><canvas id="canvas"></canvas><canvas id="snap"></canvas>
          <div class="frame" id="frame"><i class="grid"></i><i class="fine"></i><b class="h nw" data-h="nw"></b><b class="h ne" data-h="ne"></b><b class="h sw" data-h="sw"></b><b class="h se" data-h="se"></b><b class="h n" data-h="n"></b><b class="h s" data-h="s"></b><b class="h w" data-h="w"></b><b class="h e" data-h="e"></b></div>
        </div>
        <div class="gpu" id="gpu" hidden><span id="gpuicon"></span><b>Can't show this image</b><span>Editing needs graphics acceleration, which is off on this PC.</span></div>
        <div class="pill" id="pill">
          <button class="ib" id="compare" type="button" disabled></button><i class="sep"></i>
          <button class="ib" id="zoomout" type="button"></button><button class="zv" id="zoomval" type="button" title="Zoom" aria-haspopup="menu"></button><button class="ib" id="zoomin" type="button"></button><i class="sep"></i>
          <button class="ib" id="fullscreen" type="button"></button>
        </div>
        <div class="zmenu" id="zmenu" role="menu" aria-label="Zoom" hidden></div>
      </main>
      <aside class="panel" id="panel"><div class="inner" id="inner">
        <div class="seg3" id="tools" role="radiogroup" aria-label="Tool">
          <button type="button" role="radio" aria-checked="true" data-tool="adjust">Adjust</button><button type="button" role="radio" aria-checked="false" data-tool="presets">Presets</button><button type="button" role="radio" aria-checked="false" data-tool="crop">Crop</button>
        </div>
        <div class="views" id="views">
          <div class="view" id="view-adjust"></div><div class="view" id="view-presets" hidden></div><div class="view" id="view-crop" hidden></div>
        </div>
      </div></aside>
    </div>
    <div class="mmenu" id="mmenu" role="menu" aria-label="More" hidden></div>
  </div>
  <script src="../../../ui-shared/dom.js"></script>
  <script src="../../../ui-shared/icons.js"></script>
  <script src="../../../ui-shared/tabs.js"></script>
  <script src="../../../ui-shared/card.js"></script>
  <script src="../../../ui-shared/number-field.js"></script>
  <script src="keys.js"></script>
  <script src="geometry.js"></script>
  <script src="model.js"></script>
  <script src="shaders.js"></script>
  <script src="render.js"></script>
  <script src="view.js"></script>
  <script src="crop.js"></script>
  <script src="sliders.js"></script>
  <script src="histogram.js"></script>
  <script src="adjust.js"></script>
  <script src="dialogs.js"></script>
  <script src="editor.js"></script>
</body>
</html>

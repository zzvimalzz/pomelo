<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomelo</title>
  <link rel="stylesheet" href="../../../ui-shared/tokens.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-look.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-icons.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="help.css">
</head>
<body>
  <div class="window">
    <header class="titlebar">
      <div class="brand"><img src="logo.png" width="22" height="22" alt=""><span>Pomelo</span></div>
      <label class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off">
      </label>
      <div class="controls" aria-hidden="true"></div>
    </header>
    <div class="body">
      <aside class="side">
        <nav id="nav" aria-label="Settings sections"></nav>
        <div class="side-foot">
          <span class="pill" id="pill"></span>
          <span class="muted" id="ver"></span>
        </div>
      </aside>
      <main class="content" id="content"></main>
    </div>
  </div>
  <script src="../../../ui-shared/dom.js"></script>
  <script src="../../../ui-shared/wheel-shapes.js"></script>
  <script src="../../../ui-shared/wheel-glyphs.js"></script>
  <script src="../../../ui-shared/wheel-icons.js"></script>
  <script src="help.js"></script>
  <script src="settings.js"></script>
</body>
</html>

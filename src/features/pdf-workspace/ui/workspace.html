<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomelo</title>
  <link rel="stylesheet" href="../../../ui-shared/tokens.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-look.css">
  <link rel="stylesheet" href="../../../ui-shared/controls.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-icons.css">
  <link rel="stylesheet" href="../../../../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <div class="window">
    <header class="titlerow">
      <b id="docname"></b>
      <div class="titletools"><button class="ib" id="focus" type="button"></button></div>
    </header>
    <main class="well">
      <div class="scroller" id="scroller" tabindex="-1"><div class="pdfViewer" id="viewer"></div></div>
      <p class="failure" id="failure" hidden></p>
      <div class="edgehint"></div>
    </main>
  </div>
  <script src="../../../ui-shared/dom.js"></script>
  <script src="../../../ui-shared/icons.js"></script>
  <script src="../../../ui-shared/wheel-shapes.js"></script>
  <script src="../../../ui-shared/wheel-glyphs.js"></script>
  <script src="../../../ui-shared/wheel-icons.js"></script>
  <script src="keys.js"></script>
  <script src="comments-margin.js"></script>
  <script src="dialogs.js"></script>
  <script src="dock.js"></script>
  <script src="viewer.js"></script>
  <script src="focus.js"></script>
  <script src="workspace.js"></script>
</body>
</html>

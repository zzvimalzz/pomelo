<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomelo</title>
  <link rel="stylesheet" href="../../../ui-shared/tokens.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-look.css">
  <link rel="stylesheet" href="../../../ui-shared/controls.css">
  <link rel="stylesheet" href="../../../ui-shared/wheel-icons.css">
  <link rel="stylesheet" href="../../../../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <div class="window">
    <header class="titlerow">
      <div class="titleleft"><button class="ib" id="pagesbtn" type="button" aria-pressed="false" disabled></button><button class="ib" id="findbtn" type="button" aria-pressed="false" disabled></button><button class="ib" id="linksbtn" type="button" aria-pressed="false" disabled></button></div>
      <div class="nameline" id="nameline"><button class="namebtn" id="docname" type="button" title="Rename or see details"></button><i class="dot" id="docdot" title="Unsaved changes" hidden></i><small id="docsaved" role="status"></small></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Documents" hidden></div>
      <div class="titletools"><button class="btn primary" id="savebtn" type="button" hidden>Save</button><button class="ib" id="docbtn" type="button" aria-pressed="false" disabled></button><button class="ib" id="focus" type="button"></button></div>
    </header>
    <div class="body">
      <aside class="panel" id="rail"><div class="inner" id="railinner" hidden>
        <div class="railgrip" id="railgrip" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"></div>
        <div class="seg3" role="radiogroup" aria-label="Panel"><button type="button" role="radio" id="tabpages" aria-checked="true">Pages</button><button type="button" role="radio" id="taboutline" aria-checked="false">Outline</button></div>
        <div class="scrolly" id="thumbs"></div>
        <div class="scrolly" id="outline" hidden></div>
      </div></aside>
      <main class="well" data-dock="bottom">
        <div class="scroller" id="scroller" tabindex="-1"><div class="pdfViewer" id="viewer"></div></div>
        <p class="failure" id="failure" hidden></p>
        <div class="edgehint"></div>
      </main>
      <aside class="panel" id="docpanel" aria-label="Document"><div class="inner" id="docinner" hidden>
        <div class="sidehead"><h3>Document</h3><button class="sm" id="docclose" type="button"></button><i class="scanline busy" id="docloading" hidden></i></div>
        <div class="scrolly" id="docbody"></div>
      </div></aside>
      <aside class="panel" id="hitpanel"><div class="inner" id="hitinner" hidden>
        <div class="sidehead">
          <div class="seg3" role="radiogroup" aria-label="Panel"><button type="button" role="radio" id="tabsearch" aria-checked="true">Search</button><button type="button" role="radio" id="tablinks" aria-checked="false">Links</button></div>
          <button class="sm" id="hitclose" type="button"></button>
        </div>
        <div class="sideview" id="searchview">
          <div class="viewhead"><span class="total" id="hittotal"></span></div>
          <div class="scrolly" id="results"></div>
        </div>
        <div class="sideview" id="linksview" hidden>
          <div class="viewhead"><button class="pick" id="linkchoose" type="button" role="checkbox" aria-checked="false" hidden></button><span class="total" id="linkscan"></span><button class="btn primary linkcopy" id="linkcopy" type="button" disabled></button><i class="scanline" id="linkprogress" hidden></i></div>
          <div class="scrolly" id="linklist"></div>
        </div>
      </div></aside>
    </div>
  </div>
  <script src="../../../ui-shared/dom.js"></script>
  <script src="../../../ui-shared/icons.js"></script>
  <script src="../../../ui-shared/wheel-shapes.js"></script>
  <script src="../../../ui-shared/wheel-glyphs.js"></script>
  <script src="../../../ui-shared/wheel-icons.js"></script>
  <script src="keys.js"></script>
  <script src="tabs.js"></script>
  <script src="comments-margin.js"></script>
  <script src="thumbs.js"></script>
  <script src="outline.js"></script>
  <script src="sidebar.js"></script>
  <script src="dialogs.js"></script>
  <script src="colours.js"></script>
  <script src="dock-place.js"></script>
  <script src="dock.js"></script>
  <script src="select.js"></script>
  <script src="side.js"></script>
  <script src="results.js"></script>
  <script src="linklist.js"></script>
  <script src="ticks.js"></script>
  <script src="search.js"></script>
  <script src="viewer.js"></script>
  <script src="properties.js"></script>
  <script src="focus.js"></script>
  <script src="workspace.js"></script>
</body>
</html>

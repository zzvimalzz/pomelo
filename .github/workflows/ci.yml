name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 ships npm 10; 24 ships a newer npm with stricter install defaults (remote tarballs, install scripts).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:helper
      - run: node test/jobs-test.js
      - run: node test/helper-test.js
      - run: node test/engine-cli-test.js
      - run: node test/installer-test.js
      - run: node test/uninstall-test.js

  conversions:
    name: Conversion tests (built-in engines)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LibreOffice, Pandoc and the Python PDF engine are not installed here, so tests that need them are skipped.
      - run: npx electron test/updater-test.js
      - run: npx electron test/entry.js
      - run: npx electron test/edge-cases.js

  pdf-engine:
    name: PDF engine (install it, then convert)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m compileall -q scripts
      # The same code behind the Install button and the installer's engine page: a private Python environment with PyMuPDF,
      # python-docx, RapidOCR (its models are fetched here) and pillow-heif.
      - name: Install the PDF engine with Pomelo's own installer code
        shell: pwsh
        run: |
          $out = (npx electron . --install-engines=pdf 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $log = Join-Path $env:APPDATA 'Pomelo\debug.log'
            $logTail = if (Test-Path $log) { (Get-Content $log -Tail 8) -join '%0A' } else { 'no debug.log' }
            $py = ((py -3 --version 2>&1 | Out-String).Trim()) + ' / ' + ((python --version 2>&1 | Out-String).Trim())
            $tail = ((($out -split "`n" | Where-Object { $_ -match '\S' -and $_ -notmatch 'Using cached|Downloading|^npm ' } | Select-Object -Last 6) -join '%0A') + '%0A--- debug.log ---%0A' + $logTail + '%0A--- python: ' + $py)
            Write-Host "::error title=engine install failed::$tail"
            exit 1
          }
      - run: node test/pdf-layout-test.js
      - run: node test/pdf-formats-test.js

  installer:
    name: Installer (silent install, update, uninstall)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: npm run package
      - run: npm run build:installer -- --fast
      - name: Install, update and uninstall the real installer
        shell: pwsh
        run: ./tools/installer-e2e.ps1
